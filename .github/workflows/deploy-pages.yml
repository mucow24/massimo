name: Deploy to GitHub Pages

# Rebuild and publish the site on every push to main. Manual runs are also
# allowed via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages deploy actions require: read the repo, write
# the Pages deployment, and mint the OIDC token deploy-pages uses to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. Unlike CI, we do NOT cancel an in-progress run — a
# half-finished production deploy shouldn't be interrupted by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The licensed Söhne .ttf faces cannot live in this repo: it is public, and
      # the licence does not permit redistributing the font files. They are held
      # in a private repo and copied into public/ here instead, so the deployed
      # app renders and exports in Söhne while no public checkout ever holds it.
      #
      # FONTS_REPO_PAT is a fine-grained token scoped to read-only Contents on
      # mucow24/massimo-fonts. Fine-grained tokens expire (max one year), and
      # when it lapses this step fails with a checkout error that does not say
      # "expired" — check the token first if this job starts 404ing.
      - name: Fetch licensed fonts
        uses: actions/checkout@v4
        with:
          repository: mucow24/massimo-fonts
          token: ${{ secrets.FONTS_REPO_PAT }}
          path: .fonts

      # Deliberately fails the job if the fonts are missing: a deploy that
      # silently falls back to Arial is worse than one that doesn't happen.
      - name: Stage fonts into public/
        run: |
          mkdir -p public/fonts
          cp .fonts/*.ttf public/fonts/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` for the same reason as CI — the lockfile carries every
      # platform's optional deps, so the strict install is the honest one.
      - run: npm ci --no-audit --no-fund

      # Produces dist/ with relative asset URLs (production `base: './'` in
      # vite.config.ts), which resolve under the /massimo/ Pages subpath and
      # when served from root locally.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt published wins; a skipped or failed attempt leaves its
      # output empty, so `||` falls through to the attempt that set the URL.
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      # actions/deploy-pages intermittently fails on a transient Pages-backend
      # flake: "Deployment failed, try again later." on the first status poll, or
      # a deployment stuck in `deployment_queued` until the 10-minute timeout.
      # The build + artifact are fine; a manual re-run always clears it. So retry
      # the deploy once automatically. `continue-on-error` lets the first attempt
      # fail without failing the job; the retry re-creates and re-polls a fresh
      # deployment (what a manual re-run does), and only it can fail the job.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # Half the default 10-minute timeout: a healthy deploy resolves in
          # seconds, so a stuck `deployment_queued` should fail over to the
          # retry after 5 minutes rather than burning the full 10.
          timeout: 300000

      - name: Pause before retrying the deploy
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      # The last attempt keeps the default 10-minute timeout — give the deploy
      # maximum patience before declaring the whole job failed.
      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
