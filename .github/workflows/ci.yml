name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Using `npm install` rather than `npm ci`. `npm ci` is strict about
      # platform-specific optional deps (esbuild, rollup, etc.) being in the
      # lockfile, which Windows-generated lockfiles routinely miss — see
      # https://github.com/npm/cli/issues/4828. `npm install` honors the
      # lockfile for resolved versions but tolerates the omissions.
      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Cache the Chromium download so we don't pay the ~120 MB hit on
      # every CI run. Keyed by package-lock — bumping @playwright/test
      # invalidates the cache automatically. The matching browser binary
      # version lives in package-lock.json, so the hash is the right key.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      # On e2e failure, surface the trace + screenshot artifacts so the
      # failing test can be replayed locally with `npx playwright show-trace`.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
