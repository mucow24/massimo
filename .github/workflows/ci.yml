name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Aggregate gate. Branch protection requires a check named `ci`; this job
  # keeps that required-check name valid without coupling it to the
  # individual job IDs. It must run `if: always()` and fail explicitly: a
  # plain `needs:` job is SKIPPED when a dependency fails, and GitHub treats
  # a skipped required check as SATISFIED — which let PR #159 auto-merge
  # over a red e2e job.
  ci:
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all required jobs passed"

  # Fast checks: lint, format, unit tests, build. Runs in parallel with the
  # e2e job below on its own runner.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The licensed Söhne .ttf faces are git-ignored, so a clean checkout has
      # none. Without them the export tests still pass while outlining NOTHING —
      # a vacuous green. Inject them from the private repo, as the Pages deploy
      # does. FONTS_REPO_PAT is read-only Contents on mucow24/massimo-fonts.
      - name: Fetch licensed fonts
        uses: actions/checkout@v4
        with:
          repository: mucow24/massimo-fonts
          token: ${{ secrets.FONTS_REPO_PAT }}
          path: .fonts

      - name: Stage fonts into public/
        run: |
          mkdir -p public/fonts
          cp .fonts/*.ttf public/fonts/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Using `npm install` rather than `npm ci`. `npm ci` is strict about
      # platform-specific optional deps (esbuild, rollup, etc.) being in the
      # lockfile, which Windows-generated lockfiles routinely miss — see
      # https://github.com/npm/cli/issues/4828. `npm install` honors the
      # lockfile for resolved versions but tolerates the omissions.
      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # End-to-end tests on a second runner. The Chromium download + Playwright
  # run is the long pole, so isolating it here roughly halves wall-clock time
  # on green runs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The licensed Söhne .ttf faces are git-ignored, so a clean checkout has
      # none. Without them the export tests still pass while outlining NOTHING —
      # a vacuous green. Inject them from the private repo, as the Pages deploy
      # does. FONTS_REPO_PAT is read-only Contents on mucow24/massimo-fonts.
      - name: Fetch licensed fonts
        uses: actions/checkout@v4
        with:
          repository: mucow24/massimo-fonts
          token: ${{ secrets.FONTS_REPO_PAT }}
          path: .fonts

      - name: Stage fonts into public/
        run: |
          mkdir -p public/fonts
          cp .fonts/*.ttf public/fonts/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      # Cache the Chromium download so we don't pay the ~120 MB hit on
      # every CI run. Keyed by package-lock — bumping @playwright/test
      # invalidates the cache automatically. The matching browser binary
      # version lives in package-lock.json, so the hash is the right key.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No `--with-deps`: that flag shells out to apt to install system
      # libraries + fonts on every run (apt packages can't be cached on the
      # ephemeral runner), which is the job's variable long pole — 30s to
      # 5min+. The ubuntu-latest image already ships the shared libs Chromium
      # needs to launch, and our e2e suite has no pixel/screenshot tests, so
      # missing system fonts don't affect correctness. The browser binary
      # itself is still restored from the cache above.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: E2E
        run: npm run e2e

      # On e2e failure, surface the trace + screenshot artifacts so the
      # failing test can be replayed locally with `npx playwright show-trace`.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
